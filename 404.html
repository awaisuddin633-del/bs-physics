<style>
:root{--bg:#eef1e6;--card:#fbfcf7;--ink:#14302f;--mut:#5c6f6b;--acc:#2f7d6b;--brass:#b8891b;--ln:#cdd6c4}
@media(prefers-color-scheme:dark){:root{--bg:#0f1d1c;--card:#16292a;--ink:#e6efe6;--mut:#93aaa4;--acc:#5fc3a8;--brass:#e0b84a;--ln:#27403f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;gap:10px;align-items:center;z-index:5}
#back{white-space:nowrap;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:15px}
#crumb{font-size:13px;color:var(--mut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
main{max-width:720px;margin:0 auto;padding:16px 14px 48px}
h1,h2{font-family:Palatino,"Iowan Old Style",Georgia,serif;line-height:1.2;margin:8px 0 14px}h1{font-size:30px}h2{font-size:24px}
.it{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:start;background:var(--card);color:var(--ink);border:1px solid var(--ln);border-inline-start:4px solid var(--brass);border-radius:8px;padding:13px 14px;margin:0 0 9px;font-size:16px}
.it small{color:var(--mut);white-space:nowrap;align-self:center}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.tabs button,.ctl button{border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px;font-size:14px;white-space:nowrap}
.ctl .on,.tabs .on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.note{background:var(--card);border:1px dashed var(--brass);border-radius:8px;padding:12px}
#ex{font-family:Georgia,serif}#ex h3{font-family:system-ui;font-size:16px;margin:16px 0 4px;color:var(--acc)}#ex .ur{border-inline-start:3px solid var(--acc);padding-inline-start:10px;color:var(--mut)}
canvas{width:100%;background:var(--card);border:1px solid var(--ln);border-radius:10px;touch-action:none}
.ctl{flex-wrap:wrap;display:flex;gap:10px;align-items:center;margin-top:10px;font-size:14px;color:var(--mut)}
.opt{display:block;width:100%;text-align:start;margin:7px 0;padding:11px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--ink);font-size:15px}
.ok{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 25%,var(--card))}.bad{border-color:#c0504d}
#ex table{border-collapse:collapse;width:100%;font-family:system-ui;font-size:14px;margin:6px 0}#ex td,#ex th{border:1px solid var(--ln);padding:6px 8px;text-align:start}
figure{margin:14px 0}figcaption{font-size:13px;color:var(--mut);margin-top:6px}
html[lang=ur] body{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Noto Naskh Arabic',system-ui,serif;line-height:2}
@media print{header,.tabs,#acts,#qz,.ctl,footer{display:none!important}body{background:#fff;color:#000}}
footer{font-size:12px;color:var(--mut);margin-top:24px}

'five kingdom classification':{an:'kingsim',ex:{en:`<h3>Why five kingdoms?</h3><p>The two-kingdom system (plants and animals) could not place bacteria, fungi and unicellular eukaryotes. Whittaker (1969) proposed five kingdoms using three criteria: cell type (prokaryotic or eukaryotic), body organisation (unicellular or multicellular) and mode of nutrition (photosynthesis, absorption or ingestion).</p><table><tr><th>Kingdom</th><th>Cell</th><th>Body</th><th>Nutrition</th><th>Examples</th></tr><tr><td>Monera</td><td>Prokaryotic</td><td>Unicellular</td><td>Absorptive, photosynthetic, chemosynthetic</td><td>Bacteria, cyanobacteria</td></tr><tr><td>Protista</td><td>Eukaryotic</td><td>Mostly unicellular</td><td>Photosynthetic, ingestive, absorptive</td><td>Amoeba, Paramecium, Euglena</td></tr><tr><td>Fungi</td><td>Eukaryotic</td><td>Mostly multicellular (yeast unicellular)</td><td>Absorptive</td><td>Mushroom, Penicillium, yeast</td></tr><tr><td>Plantae</td><td>Eukaryotic</td><td>Multicellular</td><td>Photosynthetic</td><td>Moss, fern, rose</td></tr><tr><td>Animalia</td><td>Eukaryotic</td><td>Multicellular</td><td>Ingestive</td><td>Hydra, earthworm, human</td></tr></table>[[kingdoms]]<h3>Merits and limitations</h3><ul><li><b>Merits:</b> separated prokaryotes from eukaryotes; gave fungi their own kingdom</li><li><b>Limitations:</b> Monera mixed bacteria and archaea, which differ greatly (hence Woese's three domains); viruses have no place; Protista is a mixed, artificial group</li></ul><h3>Evolutionary relationships (phylogeny)</h3><p><b>Phylogeny</b> is the evolutionary history of a group. Evolutionary classification groups organisms by common ancestry, not by looks alone. An ancestor with all its descendants is a <b>monophyletic group (clade)</b>; if some descendants are left out it is <b>paraphyletic</b>; if unrelated groups are joined it is <b>polyphyletic</b>. Evidence comes from fossils, comparative anatomy, embryology and molecular data (DNA, rRNA).</p><h3>How to read a tree diagram</h3><ul><li>Branch tip = a group of organisms (taxon)</li><li>Node (branch point) = common ancestor</li><li>Root = the oldest ancestor</li><li>Groups that split recently are close relatives; spinning branches at a node does not change relationships</li></ul>[[tree]]<p>In this tree, fungi are closer relatives of animals than of plants.</p><h3>Quick revision</h3><ul><li>Five kingdoms: Monera, Protista, Fungi, Plantae, Animalia (Whittaker, 1969)</li><li>Criteria: cell type, body organisation, nutrition</li><li>Node = common ancestor; clade = ancestor + all descendants</li></ul>`,ur:`<h3>پانچ مملکتی نظام کیوں؟</h3><p>دو مملکتی نظام (پودے اور جانور) میں بیکٹیریا، فنجائی اور یک خلوی یوکیریاٹس کی جگہ نہیں بنتی تھی۔ وہٹیکر (1969) نے تین بنیادوں پر پانچ مملکتیں بنائیں: خلیے کی قسم (پروکیریاٹک یا یوکیریاٹک)، جسم کی ساخت (یک خلوی یا کثیر خلوی) اور غذا حاصل کرنے کا طریقہ (ضیائی تالیف، جذب یا نگلنا)۔</p><table><tr><th>مملکت</th><th>خلیہ</th><th>جسم</th><th>غذا</th><th>مثالیں</th></tr><tr><td>Monera</td><td>پروکیریاٹک</td><td>یک خلوی</td><td>جذب، ضیائی یا کیمیائی تالیف</td><td>بیکٹیریا، سائنو بیکٹیریا</td></tr><tr><td>Protista</td><td>یوکیریاٹک</td><td>زیادہ تر یک خلوی</td><td>ضیائی تالیف، نگلنا یا جذب</td><td>امیبا، پیرامیشیم، یوگلینا</td></tr><tr><td>Fungi</td><td>یوکیریاٹک</td><td>زیادہ تر کثیر خلوی (خمیر یک خلوی)</td><td>جذب</td><td>کھمبی، پینیسیلیم، خمیر</td></tr><tr><td>Plantae</td><td>یوکیریاٹک</td><td>کثیر خلوی</td><td>ضیائی تالیف</td><td>کائی، فرن، گلاب</td></tr><tr><td>Animalia</td><td>یوکیریاٹک</td><td>کثیر خلوی</td><td>نگلنا</td><td>ہائیڈرا، کیچوا، انسان</td></tr></table>[[kingdoms]]<h3>خوبیاں اور خامیاں</h3><ul><li><b>خوبیاں:</b> پروکیریاٹس کو یوکیریاٹس سے الگ کیا؛ فنجائی کو اپنی مملکت ملی</li><li><b>خامیاں:</b> مونیرا میں بیکٹیریا اور آرکیا شامل تھے جو بہت مختلف ہیں (اسی لیے ووز نے تین ڈومین بنائے)؛ وائرس کی جگہ نہیں؛ پروٹسٹا ایک ملا جلا مصنوعی گروہ ہے</li></ul><h3>ارتقائی رشتے (Phylogeny)</h3><p><b>Phylogeny</b> کسی گروہ کی ارتقائی تاریخ ہے۔ ارتقائی درجہ بندی جانداروں کو صرف ظاہری شکل نہیں بلکہ مشترکہ جد کی بنیاد پر گروہوں میں رکھتی ہے۔ جد اور اس کی تمام اولاد کا گروہ <b>Monophyletic (کلیڈ)</b> کہلاتا ہے؛ جس میں کچھ اولاد چھوٹ جائے وہ <b>Paraphyletic</b>، اور جس میں غیر متعلق گروہ جمع ہوں وہ <b>Polyphyletic</b> ہے۔ شواہد: فاسل، تقابلی اناٹومی، جنینیات اور مالیکیولی ڈیٹا (DNA، rRNA)۔</p><h3>ٹری ڈایاگرام پڑھنے کا طریقہ</h3><ul><li>شاخ کا سرا = جانداروں کا گروہ (Taxon)</li><li>نوڈ (جوڑ) = مشترکہ جد</li><li>جڑ (Root) = سب سے قدیم جد</li><li>جو شاخیں حال ہی میں الگ ہوئیں وہ قریبی رشتہ دار ہیں؛ نوڈ پر شاخیں گھمانے سے رشتہ نہیں بدلتا</li></ul>[[tree]]<p>اس درخت میں فنجائی، نباتات کے بجائے حیوانات کے زیادہ قریبی رشتہ دار ہیں۔</p><h3>فوری دہرائی</h3><ul><li>پانچ مملکتیں: Monera, Protista, Fungi, Plantae, Animalia (وہٹیکر، 1969)</li><li>بنیادیں: خلیے کی قسم، جسم کی ساخت، غذا</li><li>ٹری میں نوڈ = مشترکہ جد؛ کلیڈ = جد + اس کی تمام اولاد</li></ul>`}},
'patterns of organization':{an:'symsim',ex:{en:`<h3>Grades of organisation</h3><ul><li><b>Cellular grade:</b> cells cooperate loosely, no true tissues (protozoan colonies, sponges)</li><li><b>Cell-tissue grade:</b> cells arranged into tissues (Cnidaria)</li><li><b>Tissue-organ grade:</b> tissues form organs (flatworms)</li><li><b>Organ-system grade:</b> organs form systems (higher animals)</li></ul><h3>Levels in the body</h3><p>Cell, tissue, organ, organ system, organism.</p>[[levels]]<h3>Body symmetry</h3><ul><li><b>Asymmetry:</b> no plane divides the body into equal halves (most sponges)</li><li><b>Radial symmetry:</b> many planes through the central axis give equal halves (Hydra, jellyfish)</li><li><b>Bilateral symmetry:</b> only one plane (sagittal) gives mirror halves (flatworms to humans); it comes with a head region (cephalization)</li></ul>[[symmetry]]<h3>Germ layers</h3><p><b>Diploblastic:</b> ectoderm and endoderm with jelly-like mesoglea between (Cnidaria). <b>Triploblastic:</b> a third layer, the mesoderm, is added (flatworms and above).</p><h3>Body cavity</h3><table><tr><th>Type</th><th>Cavity</th><th>Example</th></tr><tr><td>Acoelomate</td><td>No body cavity</td><td>Flatworms</td></tr><tr><td>Pseudocoelomate</td><td>Cavity not fully lined by mesoderm</td><td>Roundworms</td></tr><tr><td>Eucoelomate</td><td>True coelom lined by mesoderm</td><td>Annelids, molluscs, arthropods, chordates</td></tr></table><h3>Quick revision</h3><ul><li>Levels: cell, tissue, organ, organ system, organism</li><li>Symmetry: asymmetry, radial, bilateral</li><li>Diploblastic = 2 germ layers; triploblastic = 3</li></ul>`,ur:`<h3>تنظیم کے درجے (Grades of organisation)</h3><ul><li><b>خلوی درجہ:</b> خلیے ڈھیلے ڈھالے تعاون کرتے ہیں، حقیقی نسیج نہیں (پروٹوزوا کالونیاں، اسفنج)</li><li><b>خلیہ-نسیج درجہ:</b> خلیے نسیجوں میں ترتیب پاتے ہیں (Cnidaria)</li><li><b>نسیج-عضو درجہ:</b> نسیج مل کر اعضا بناتے ہیں (چپٹے کیڑے)</li><li><b>عضوی نظام درجہ:</b> اعضا مل کر نظام بناتے ہیں (اعلیٰ جانور)</li></ul><h3>جسم کے درجے</h3><p>خلیہ، نسیج، عضو، عضوی نظام، جاندار۔</p>[[levels]]<h3>جسمانی تشاکل (Symmetry)</h3><ul><li><b>عدم تشاکل:</b> کوئی سطح جسم کو دو برابر حصوں میں نہیں بانٹتی (اکثر اسفنج)</li><li><b>شعاعی تشاکل:</b> مرکزی محور سے گزرنے والی کئی سطحیں دو برابر حصے کرتی ہیں (ہائیڈرا، جیلی فش)</li><li><b>دو طرفہ تشاکل:</b> صرف ایک سطح (Sagittal) دو عکسی حصے کرتی ہے (چپٹے کیڑوں سے انسان تک)؛ اس کے ساتھ سر کا حصہ بنتا ہے (Cephalization)</li></ul>[[symmetry]]<h3>جرثومی تہیں (Germ layers)</h3><p><b>دو تہی (Diploblastic):</b> ایکٹوڈرم اور اینڈوڈرم، درمیان میں جیلی نما میسوگلیا (Cnidaria)۔ <b>تین تہی (Triploblastic):</b> تیسری تہہ میسوڈرم بھی ہوتی ہے (چپٹے کیڑوں سے آگے)۔</p><h3>جسمانی گہا (Body cavity)</h3><table><tr><th>قسم</th><th>گہا</th><th>مثال</th></tr><tr><td>Acoelomate</td><td>کوئی گہا نہیں</td><td>چپٹے کیڑے</td></tr><tr><td>Pseudocoelomate</td><td>گہا جو میسوڈرم سے مکمل نہیں ڈھکی</td><td>گول کیڑے</td></tr><tr><td>Eucoelomate</td><td>حقیقی Coelom، میسوڈرم سے ڈھکا</td><td>اینیلیڈا، مولسکا، آرتھروپوڈا، کورڈیٹا</td></tr></table><h3>فوری دہرائی</h3><ul><li>درجے: خلیہ، نسیج، عضو، عضوی نظام، جاندار</li><li>تشاکل: عدم، شعاعی، دو طرفہ</li><li>Diploblastic = 2 تہیں؛ Triploblastic = 3 تہیں</li></ul>`}},
'classification of organisms':{an:'orgsim',ex:{en:`<h3>Definition</h3><p><b>Classification</b> is the arrangement of organisms into groups (called <b>taxa</b>) according to their similarities, differences and evolutionary relationships. The science of classification is <b>taxonomy</b>; the wider study of relationships among organisms is <b>systematics</b>.</p><h3>Why do we classify?</h3><ul><li>Millions of species exist, so organised study becomes possible</li><li>Easy identification and one universal naming system</li><li>Shows evolutionary (phylogenetic) relationships</li><li>Helps predict the characters of a newly found organism</li></ul><h3>Brief history</h3><table><tr><th>Scientist</th><th>Contribution</th></tr><tr><td>Aristotle (4th c. BC)</td><td>First system; animals grouped as Enaima (with blood) and Anaima (without blood)</td></tr><tr><td>John Ray (1600s)</td><td>Introduced the species concept</td></tr><tr><td>Linnaeus (1735, 1758)</td><td>Father of taxonomy; hierarchy and binomial nomenclature (Systema Naturae)</td></tr><tr><td>Darwin (1859)</td><td>Descent with modification: classification should reflect common ancestry</td></tr><tr><td>Haeckel (1866)</td><td>Proposed the kingdom Protista</td></tr><tr><td>Whittaker (1969)</td><td>Five-kingdom system</td></tr><tr><td>Woese (1990)</td><td>Three domains: Bacteria, Archaea, Eukarya</td></tr></table><h3>Taxonomic hierarchy</h3><p>From the largest group to the smallest: <b>Kingdom, Phylum, Class, Order, Family, Genus, Species</b>. Modern systems place <b>Domain</b> above Kingdom. Each step down holds fewer organisms that share more characters. Memory aid: <i>King Philip Came Over For Good Soup</i>.</p><table><tr><th>Rank</th><th>Human</th><th>House cat</th></tr><tr><td>Kingdom</td><td>Animalia</td><td>Animalia</td></tr><tr><td>Phylum</td><td>Chordata</td><td>Chordata</td></tr><tr><td>Class</td><td>Mammalia</td><td>Mammalia</td></tr><tr><td>Order</td><td>Primates</td><td>Carnivora</td></tr><tr><td>Family</td><td>Hominidae</td><td>Felidae</td></tr><tr><td>Genus</td><td>Homo</td><td>Felis</td></tr><tr><td>Species</td><td>Homo sapiens</td><td>Felis catus</td></tr></table>[[rank]]<h3>Binomial nomenclature</h3><p>Every species has a two-part Latin name: Genus (capital first letter) plus species (all small letters), written in italics or underlined separately, e.g. <i>Homo sapiens</i>, <i>Panthera leo</i> (lion). Animal names follow the ICZN rules.</p><h3>Basis of classification</h3><p>Morphology and anatomy, embryology, cell structure, biochemistry, chromosomes, DNA and protein sequences, behaviour and ecology.</p><h3>Types of classification</h3><ul><li><b>Artificial</b>: based on one or a few characters (e.g. Linnaeus's sexual system for plants)</li><li><b>Natural</b>: based on overall similarity of many characters</li><li><b>Phylogenetic</b>: based on evolutionary relationships; the modern approach</li></ul><h3>Five-kingdom system (Whittaker, 1969)</h3><table><tr><th>Kingdom</th><th>Cell type</th><th>Nutrition</th></tr><tr><td>Monera</td><td>Prokaryotic</td><td>Absorptive, photosynthetic or chemosynthetic</td></tr><tr><td>Protista</td><td>Eukaryotic, mostly unicellular</td><td>Photosynthetic, ingestive or absorptive</td></tr><tr><td>Fungi</td><td>Eukaryotic</td><td>Absorptive</td></tr><tr><td>Plantae</td><td>Eukaryotic, multicellular</td><td>Photosynthetic</td></tr><tr><td>Animalia</td><td>Eukaryotic, multicellular</td><td>Ingestive</td></tr></table>[[kingdoms]]<h3>Quick revision</h3><ul><li>Taxonomy = classification + naming</li><li>Largest to smallest: Kingdom, Phylum, Class, Order, Family, Genus, Species</li><li>Species name = Genus + species (binomial)</li><li>Linnaeus: father of taxonomy; Whittaker: five kingdoms; Woese: three domains</li></ul><p class="ur">Roman Urdu: Classification ka matlab hai jandaron ko unki mushabihat aur farq ki buniyad par groups mein baantna. Sab se bara group Kingdom aur sab se chhota Species hota hai. Har species ka naam do hisson (Genus + species) par mushtamil hota hai.</p>`,ur:`<h3>تعریف</h3><p><b>درجہ بندی (Classification)</b> جانداروں کو ان کی مشابہتوں، فرق اور ارتقائی رشتوں کی بنیاد پر گروہوں (<b>Taxa</b>) میں تقسیم کرنے کا نام ہے۔ اس علم کو <b>Taxonomy</b> کہتے ہیں، اور جانداروں کے آپسی رشتوں کے وسیع مطالعے کو <b>Systematics</b>۔</p><h3>درجہ بندی کیوں کی جاتی ہے؟</h3><ul><li>لاکھوں اقسام کا منظم مطالعہ ممکن ہوتا ہے</li><li>شناخت آسان ہوتی ہے اور نام دینے کا ایک عالمی نظام ملتا ہے</li><li>ارتقائی (Phylogenetic) رشتے واضح ہوتے ہیں</li><li>نئے دریافت شدہ جاندار کی خصوصیات کا اندازہ لگایا جا سکتا ہے</li></ul><h3>مختصر تاریخ</h3><table><tr><th>سائنس دان</th><th>کارنامہ</th></tr><tr><td>ارسطو (چوتھی صدی قبل مسیح)</td><td>پہلا نظام؛ جانوروں کو خون والے (Enaima) اور بغیر خون والے (Anaima) میں بانٹا</td></tr><tr><td>جان رے (1600ء کی دہائی)</td><td>نوع (Species) کا تصور دیا</td></tr><tr><td>لینیئس (1735، 1758)</td><td>درجہ بندی کا باپ؛ مراتب اور دو نامی نظام (Systema Naturae)</td></tr><tr><td>ڈارون (1859)</td><td>درجہ بندی کو مشترکہ نسب ظاہر کرنا چاہیے</td></tr><tr><td>ہیکل (1866)</td><td>مملکت Protista تجویز کی</td></tr><tr><td>وہٹیکر (1969)</td><td>پانچ مملکتوں کا نظام</td></tr><tr><td>ووز (1990)</td><td>تین ڈومین: Bacteria، Archaea، Eukarya</td></tr></table><h3>درجہ بندی کے مراتب</h3><p>سب سے بڑے گروہ سے سب سے چھوٹے تک: <b>مملکت، شاخ، جماعت، رتبہ، خاندان، جنس، نوع</b> (Kingdom, Phylum, Class, Order, Family, Genus, Species)۔ جدید نظام میں مملکت سے اوپر <b>ڈومین</b> ہوتا ہے۔ ہر قدم نیچے جانے پر جاندار کم اور زیادہ مشابہ ہوتے جاتے ہیں۔ یاد رکھنے کا جملہ: <i>King Philip Came Over For Good Soup</i>۔</p><table><tr><th>مرتبہ</th><th>انسان</th><th>بلی</th></tr><tr><td>مملکت</td><td>Animalia</td><td>Animalia</td></tr><tr><td>شاخ</td><td>Chordata</td><td>Chordata</td></tr><tr><td>جماعت</td><td>Mammalia</td><td>Mammalia</td></tr><tr><td>رتبہ</td><td>Primates</td><td>Carnivora</td></tr><tr><td>خاندان</td><td>Hominidae</td><td>Felidae</td></tr><tr><td>جنس</td><td>Homo</td><td>Felis</td></tr><tr><td>نوع</td><td>Homo sapiens</td><td>Felis catus</td></tr></table>[[rank]]<h3>دو نامی نظام (Binomial Nomenclature)</h3><p>ہر نوع کا لاطینی نام دو حصوں پر مشتمل ہوتا ہے: جنس (پہلا حرف بڑا) اور نوع (سب حروف چھوٹے)، جیسے <i>Homo sapiens</i> اور <i>Panthera leo</i> (شیر)۔ جانوروں کے ناموں پر ICZN کے اصول لاگو ہوتے ہیں۔</p><h3>درجہ بندی کی بنیادیں</h3><p>ظاہری ساخت اور اناٹومی، جنینیات، خلیے کی ساخت، حیاتی کیمیا، کروموسوم، ڈی این اے اور پروٹین کی ترتیب، رویہ اور ماحول۔</p><h3>درجہ بندی کی اقسام</h3><ul><li><b>مصنوعی</b>: ایک یا چند صفات پر مبنی (مثلاً لینیئس کا پودوں کے لیے جنسی نظام)</li><li><b>قدرتی</b>: بہت سی صفات کی مجموعی مشابہت پر مبنی</li><li><b>ارتقائی (Phylogenetic)</b>: ارتقائی رشتوں پر مبنی؛ جدید طریقہ</li></ul><h3>پانچ مملکتی نظام (وہٹیکر، 1969)</h3><table><tr><th>مملکت</th><th>خلیے کی قسم</th><th>غذا حاصل کرنے کا طریقہ</th></tr><tr><td>Monera</td><td>پروکیریاٹک</td><td>جذب، ضیائی یا کیمیائی تالیف</td></tr><tr><td>Protista</td><td>یوکیریاٹک، زیادہ تر یک خلوی</td><td>ضیائی تالیف، نگلنا یا جذب</td></tr><tr><td>Fungi</td><td>یوکیریاٹک</td><td>جذب</td></tr><tr><td>Plantae</td><td>یوکیریاٹک، کثیر خلوی</td><td>ضیائی تالیف</td></tr><tr><td>Animalia</td><td>یوکیریاٹک، کثیر خلوی</td><td>نگلنا (ingestion)</td></tr></table>[[kingdoms]]<h3>فوری دہرائی</h3><ul><li>Taxonomy = درجہ بندی + نام رکھنا</li><li>بڑے سے چھوٹے: مملکت، شاخ، جماعت، رتبہ، خاندان، جنس، نوع</li><li>نوع کا نام = جنس + نوع (دو نامی)</li><li>لینیئس: درجہ بندی کا باپ؛ وہٹیکر: پانچ مملکتیں؛ ووز: تین ڈومین</li></ul>`}},
'pseudopodia':{an:'amoeba',m:'blob',ex:`<h3>What it is</h3><p>Amoeboid locomotion is movement by temporary extensions of the cell called <b>pseudopodia</b> ("false feet"). It is seen in Amoeba, white blood cells and many Protozoa.</p><h3>How it works</h3><p>Cytoplasm has two layers: clear gel-like <b>ectoplasm</b> outside and granular fluid <b>endoplasm</b> inside. Endoplasm streams forward into the tip of the pseudopodium and turns into gel at the edge (sol-gel conversion). At the rear (uroid) actin-myosin contraction pushes the cytoplasm forward, so the cell glides.</p><h3>Types</h3><p>Lobopodia (Amoeba), filopodia (Euglypha), reticulopodia (Foraminifera), axopodia (Actinosphaerium). Pseudopodia also surround food in phagocytosis.</p><p class="ur">Roman Urdu: Amoeba apna cytoplasm aage behata hai aur pseudopodium banata hai. Isi se wo chalta hai aur khana pakarta hai.</p>`},
'metamerism':{an:'worm',m:'worm',ex:`<h3>Metamerism</h3><p>The body is divided into a series of similar repeated segments called <b>metameres</b>, separated internally by septa. Each segment has its own set of muscles, nephridia, nerve ganglion and blood vessels.</p><h3>Tagmatization</h3><p>Grouping of segments into specialised regions (<b>tagmata</b>), e.g. head, thorax and abdomen in arthropods. In earthworms segments are mostly alike, but polychaetes have a specialised head.</p><h3>Why it matters</h3><p>Coelomic fluid acts as a hydrostatic skeleton. Circular muscles make a segment long and thin, longitudinal muscles make it short and fat, and setae anchor it, so a peristaltic wave moves the worm forward. Segmentation also helps regeneration.</p><p class="ur">Roman Urdu: Annelida ka jism dohrane wale hisson (segments) mein bata hota hai. Har hissa apna alag nizam rakhta hai, is liye harkat aur regeneration asaan hoti hai.</p>`},
'phylum cnidaria':{an:'nema',m:'polyp',ex:`<h3>Body plan</h3><p>Cnidarians (Hydra, jellyfish, corals, sea anemones) are radially symmetrical and diploblastic: outer epidermis, middle jelly-like mesoglea and inner gastrodermis around a gastrovascular cavity with one opening.</p><h3>Body wall and nematocysts</h3><p>The epidermis contains <b>cnidocytes</b>. Each holds a stinging capsule, the <b>nematocyst</b>, with a coiled thread. When the trigger (cnidocil) is touched, water rushes in, pressure rises and the thread shoots out within microseconds, injecting toxin or sticking to prey. It is used for defence and food capture.</p><h3>Forms</h3><p>Polyp (sessile, tube-shaped) and medusa (free-swimming, bell-shaped); many species alternate between them.</p><p class="ur">Roman Urdu: Cnidaria ke tentacles mein stinging cells hote hain. Chhoone par unka dhaga tez raftar se nikalta hai aur shikar ko pakar leta hai.</p>`}
};

const col=n=>getComputedStyle(document.body).getPropertyValue(n).trim();
